[workspace]
resolver = "2"
members = ["crates/remoteid-tipos", "crates/remoteid-cripto", "crates/remoteid-autorizacao", "crates/remoteid-core", "crates/remoteid-cli", "crates/remoteid-pkcs11", "crates/remoteid-daemon", "crates/remoteid-protocolo", "crates/remoteid-gtk", "crates/remoteid-mock"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-only"
repository = "https://github.com/LLawli/RemoteID-linux"

[workspace.dependencies]
base64 = "0.23"
rand = "0.8"
rsa = { version = "0.9", features = ["sha2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
cryptoki-sys = "0.5"
cms = { version = "0.2", default-features = false, features = ["alloc"] }
der = "0.7"
ureq = { version = "3", features = ["json"] }
x509-cert = "0.2"

[profile.release]
strip = true
