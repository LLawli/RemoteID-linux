[package]
name = "remoteid-gtk"
description = "O app RemoteID-linux: janela GTK4 + servidor do socket in-process (assina enquanto a janela está aberta)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "remoteid_gtk"
path = "src/lib.rs"

[[bin]]
name = "remoteid-app"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.9" }
adw = { package = "libadwaita", version = "0.7", features = ["v1_4"] }
remoteid-aplicacao = { path = "../remoteid-aplicacao" }
remoteid-caminhos = { path = "../remoteid-caminhos" }
remoteid-autorizacao = { path = "../remoteid-autorizacao" }
remoteid-tipos = { path = "../remoteid-tipos" }
remoteid-daemon = { path = "../remoteid-daemon" }
remoteid-protocolo = { path = "../remoteid-protocolo" }
serde_json.workspace = true
