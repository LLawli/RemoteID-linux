[package]
name = "remoteid-assinatura"
description = "Envelope PKCS#7 / CAdES-BES do RemoteID-linux (núcleo puro)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
remoteid-tipos = { path = "../remoteid-tipos" }
remoteid-cripto = { path = "../remoteid-cripto" }
cms.workspace = true
der.workspace = true
x509-cert.workspace = true

[dev-dependencies]
remoteid-cripto = { path = "../remoteid-cripto" }
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
rand = "0.8"
cms = { version = "0.2", features = ["alloc"] }
der = "0.7"
x509-cert = { version = "0.2", features = ["builder"] }
