[package]
name = "remoteid-core"
description = "Motor do certificado em nuvem RemoteID (Certisign) para Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
remoteid-tipos = { path = "../remoteid-tipos" }
remoteid-cripto = { path = "../remoteid-cripto" }
remoteid-autorizacao = { path = "../remoteid-autorizacao" }
remoteid-estado = { path = "../remoteid-estado" }
remoteid-assinatura = { path = "../remoteid-assinatura" }
remoteid-protocolo-servidor = { path = "../remoteid-protocolo-servidor" }
remoteid-store-json = { path = "../remoteid-store-json" }
remoteid-chave-pem = { path = "../remoteid-chave-pem" }
remoteid-redacao = { path = "../remoteid-redacao" }
remoteid-diag-jsonl = { path = "../remoteid-diag-jsonl" }
remoteid-http = { path = "../remoteid-http" }
remoteid-portas = { path = "../remoteid-portas" }
remoteid-relogio-sistema = { path = "../remoteid-relogio-sistema" }
remoteid-ambiente-sistema = { path = "../remoteid-ambiente-sistema" }
base64.workspace = true
rand.workspace = true
rsa.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
cms.workspace = true
der.workspace = true
ureq.workspace = true
x509-cert.workspace = true

[dev-dependencies]
# `builder` só nos testes: permite forjar um certificado autoassinado e provar
# que a verificação aceita a assinatura certa e recusa a errada.
x509-cert = { version = "0.2", features = ["builder"] }
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
rand = "0.8"
cms = { version = "0.2", features = ["alloc"] }
der = "0.7"
