[package]
name = "remoteid-protocolo"
description = "Protocolo JSON do socket do daemon RemoteID-linux, compartilhado entre daemon, janela GTK e módulo PKCS#11"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "remoteid_protocolo"
path = "src/lib.rs"

# Crate-folha de propósito: só serde. Sem GTK, sem os crates de domínio. É o que
# permite o cdylib do PKCS#11 (que NÃO pode linkar GTK) falar o mesmo
# protocolo que a janela.
[dependencies]
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true
