[package]
name = "remoteid-pkcs11"
description = "Módulo PKCS#11 (Cryptoki) do certificado em nuvem RemoteID"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "remoteid_pkcs11"
# cdylib é o produto (o `.so` que o p11-kit carrega); rlib existe só para os
# testes unitários poderem enxergar o crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
cryptoki-sys.workspace = true
remoteid-core = { path = "../remoteid-core" }
# O protocolo do socket (crate-folha, sem GTK): o braço de produção do C_Sign
# fala com o app por ele. NUNCA depender de remoteid-gtk/daemon aqui — este é
# um cdylib e não pode linkar GTK.
remoteid-protocolo = { path = "../remoteid-protocolo" }
serde_json.workspace = true
base64.workspace = true
der.workspace = true
rsa.workspace = true
sha2.workspace = true
x509-cert.workspace = true

[dev-dependencies]
der.workspace = true
rand.workspace = true
rsa.workspace = true
sha2.workspace = true
x509-cert = { workspace = true, features = ["builder"] }
