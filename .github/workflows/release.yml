# Dispara por tag, e só por tag: a versão é um ato deliberado, feito pelo
# bin/release. O workflow_dispatch refaz a release de uma tag que já existe.
#
# A extensão chega a quem usa pelo remote do Âncora e pelo FlatPark. A release
# leva o código, o binário compilado no GNOME 51 (com a janela e o módulo) e o
# binário para servidores (sem a janela, estático), cada um com sha256, e as
# notas do CHANGELOG.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag que já existe, como v0.4.0
        required: true

permissions:
  contents: write

jobs:
  binario:
    runs-on: ubuntu-24.04
    # O SDK do GNOME 51 já vem na imagem. O --privileged é para o bubblewrap
    # do `flatpak run` dentro do container.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Rust do SDK
        run: >
          flatpak install -y --noninteractive --system flathub
          org.freedesktop.Sdk.Extension.rust-stable//26.08

      - name: Compila e empacota
        run: scripts/binario.sh

      - uses: actions/upload-artifact@v4
        with:
          name: binario
          path: target/sdk/remoteid-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 1

  # O binário para servidores: sem a janela, estático com musl, roda em
  # qualquer Linux x86_64. O script vê o Alpine e compila direto.
  servidor:
    runs-on: ubuntu-24.04
    container:
      image: rust:1.92-alpine
    steps:
      - name: Ferramentas do checkout e do script
        run: apk add -q bash git

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Compila e empacota
        run: scripts/servidor.sh

      - uses: actions/upload-artifact@v4
        with:
          name: servidor
          path: target/servidor/remoteid-servidor-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [binario, servidor]
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: A tag, o pacote e o metainfo dizem a mesma versão
        run: |
          versao="${TAG#v}"
          echo "VERSAO=$versao" >> "$GITHUB_ENV"
          pacote=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          [ "$pacote" = "$versao" ] || {
              echo "a tag $TAG não bate com o Cargo.toml ($pacote)" >&2
              exit 1
          }
          metainfo=$(sed -n 's/.*<release version="\([^"]*\)".*/\1/p' \
              dev.lukakuuhaku.Ancora.Driver.RemoteID.metainfo.xml | head -n 1)
          [ "$metainfo" = "$versao" ] || {
              echo "a tag $TAG não bate com o metainfo ($metainfo)" >&2
              exit 1
          }

      - name: Notas, da seção desta versão no CHANGELOG
        run: |
          awk -v cabecalho="## [$VERSAO]" '
              index($0, cabecalho) == 1 { dentro = 1; next }
              dentro && index($0, "## [") == 1 { exit }
              dentro { print }
          ' CHANGELOG.md > notas.md
          # Uma release com corpo vazio some para quem acompanha pelo feed.
          grep -q '[^[:space:]]' notas.md || {
              echo "o CHANGELOG não tem a seção $VERSAO" >&2
              exit 1
          }
          cat >> notas.md <<'FIM'

          ## Instalar

          No Âncora, pela tela de extensões dele ou pelo terminal:

          ```bash
          flatpak remote-add --user --if-not-exists ancora https://flatpak.lukakuuhaku.dev/ancora.flatpakrepo
          flatpak install --user ancora dev.lukakuuhaku.Ancora dev.lukakuuhaku.Ancora.Driver.RemoteID
          ```

          No Tessera, pelo FlatPark:

          ```bash
          flatpak remote-add --user --if-not-exists flatpark https://dl.flatpark.org/flatpark.flatpakrepo
          flatpak install --user flatpark io.github.pedrohqb.Tessera io.github.pedrohqb.Tessera.Driver.RemoteID
          ```

          Num servidor, `remoteid-servidor-x86_64.tar.gz` traz o `remoteid` sem a janela, estático, para qualquer Linux x86_64; `remoteid servir` é a API. `remoteid-x86_64.tar.gz` traz o programa com a janela e o módulo PKCS#11, compilados no GNOME 51.
          FIM

      - name: Código, com checksum
        run: |
          nome="remoteid-$VERSAO"
          git archive --format=tar.gz --prefix="$nome/" -o "$nome.tar.gz" HEAD
          sha256sum "$nome.tar.gz" > "$nome.tar.gz.sha256"
          cat "$nome.tar.gz.sha256"

      - uses: actions/download-artifact@v4
        with:
          name: binario

      - uses: actions/download-artifact@v4
        with:
          name: servidor

      - name: Binário, com checksum
        run: |
          binario=remoteid-x86_64.tar.gz
          # Menos que isso é um pacote sem um dos dois programas.
          [ "$(tar tzf "$binario" | grep -cE '^(bin/remoteid|lib/libremoteid\.so)$')" = 2 ] || {
              echo "o $binario não traz o programa e o módulo" >&2
              exit 1
          }
          [ "$(stat -c %s "$binario")" -gt 1000000 ] || {
              echo "o $binario é pequeno demais" >&2
              exit 1
          }
          sha256sum "$binario" > "$binario.sha256"
          cat "$binario.sha256"

      - name: Binário para servidores, com checksum
        run: |
          servidor=remoteid-servidor-x86_64.tar.gz
          [ "$(tar tzf "$servidor" | grep -cx 'bin/remoteid')" = 1 ] || {
              echo "o $servidor não traz o programa" >&2
              exit 1
          }
          [ "$(stat -c %s "$servidor")" -gt 1000000 ] || {
              echo "o $servidor é pequeno demais" >&2
              exit 1
          }
          sha256sum "$servidor" > "$servidor.sha256"
          cat "$servidor.sha256"

      - name: Publica
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          arquivos=("remoteid-$VERSAO.tar.gz" "remoteid-$VERSAO.tar.gz.sha256"
              remoteid-x86_64.tar.gz remoteid-x86_64.tar.gz.sha256
              remoteid-servidor-x86_64.tar.gz remoteid-servidor-x86_64.tar.gz.sha256)
          if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" --title "$VERSAO" --notes-file notas.md
              gh release upload "$TAG" --clobber "${arquivos[@]}"
          else
              gh release create "$TAG" --title "$VERSAO" --notes-file notas.md "${arquivos[@]}"
          fi
