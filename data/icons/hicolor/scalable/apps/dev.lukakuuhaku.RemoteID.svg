<?xml version="1.0" encoding="UTF-8"?>
<!-- Ícone do RemoteID-linux. Nuvem = o certificado mora no HSM da Certisign,
     não na máquina; selo dentado = certificação. O serrilhado do selo é o que
     faz o ícone ler como "selo de certificação" e não como "concluído"; foi
     mantido porque ainda distingue a 24px, que é o tamanho onde o ícone vive.
     Paleta Adwaita. -->
